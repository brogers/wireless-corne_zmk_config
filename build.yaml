# Uncomment the 'shield: nice_view' lines below if you are using nice!view displays.
# Additionally, you should enable the display feature in 'config/blecorne.conf'.
---
include:
  # Only the left (central) half advertises over Bluetooth, so the home and
  # work keyboards get separate left builds with their own names (max 16 chars).
  - board: blecorne_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y '-DCONFIG_ZMK_KEYBOARD_NAME="Corne Black"
    shield: nice_view
    artifact-name: blecorne_left-home
  - board: blecorne_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y '-DCONFIG_ZMK_KEYBOARD_NAME="Corne Silver"'
    shield: nice_view
    artifact-name: blecorne_left-work
  - board: blecorne_right
    shield: nice_view

  # Uncomment the following to build a "settings reset" firmware
  # to clear persistent settings (bluetooth connections, etc).
  # - board: blecorne_left
  #   shield: settings_reset
  # - board: blecorne_right
  #   shield: settings_reset
