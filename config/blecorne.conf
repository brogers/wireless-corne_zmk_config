CONFIG_ZMK_DISPLAY=y

# Always advertise the compiled-in CONFIG_ZMK_KEYBOARD_NAME. ZMK implies a
# dynamic name, which Zephyr saves to flash on first boot and then restores
# over the compiled name, so renaming via build.yaml would never take effect.
CONFIG_BT_DEVICE_NAME_DYNAMIC=n

# Keep BLE links on the 1M PHY (this option only disables BT_CTLR_PHY_2M).
# Reconnecting with the saved peripheral latency of 30 and then switching to
# 2M made the link go silent and drop every few seconds on this laptop's
# Intel controller (seen in a btmon capture); fresh pairings were unaffected.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
